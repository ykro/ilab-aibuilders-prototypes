<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desacople de Captura y Decision · Data Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data Flow · Diagram Design</p>
    <h1>Separacion Estricta entre Captura (Input) y Decision (Output)</h1>

    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dual-engine-flow-title dual-engine-flow-desc">
      <title id="dual-engine-flow-title">Separacion entre Captura y Tablero de Decision</title>
      <desc id="dual-engine-flow-desc">Flujo secuencial mostrando como la pantalla de captura envia datos limpios al motor bimonetario y de triaje para renderizar una pantalla independiente de decisiones.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zone: Procesamiento Hibrido -->
      <rect x="344" y="64" width="312" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="436" y="68" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="77" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MOTOR DE ANALISIS</text>

      <!-- Arrows first -->
      <!-- Input -> Parser Determinista -->
      <line x1="256" y1="140" x2="384" y2="140" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Parser Determinista -> Sintesis Gemini -->
      <line x1="500" y1="176" x2="500" y2="224" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Sintesis Gemini -> Pantalla Decision -->
      <line x1="616" y1="260" x2="744" y2="260" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Return arrow: Editar / Simular from Output back to Input -->
      <path d="M 852,220 V 104 Q 852,96 844,96 H 156 Q 148,96 148,104" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="284" y="120" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="129" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PAYLOAD</text>

      <rect x="512" y="194" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="203" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESTRUCTURA</text>

      <rect x="644" y="240" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="249" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DECISIONES</text>

      <rect x="456" y="76" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="85" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDITAR DATOS</text>

      <!-- Node 1: Pantalla 1 (Input) -->
      <rect x="40" y="104" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="104" width="216" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="112" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.45)" stroke-width="0.8"/>
      <text x="66" y="121" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW 1</text>
      <text x="248" y="168" fill="rgba(45,49,66,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="148" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pantalla de Captura</text>
      <text x="148" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Voz · Mes/Semana · PDF</text>

      <!-- Node 2: Extraccion y Calculo Bimonetario -->
      <rect x="384" y="104" width="232" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="104" width="232" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="392" y="112" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="410" y="121" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARSE</text>
      <text x="608" y="168" fill="rgba(45,49,66,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="500" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Extraccion Determinista</text>
      <text x="500" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Zlib PDF · Q + $ Simultaneo</text>

      <!-- Node 3: Sintesis Estructurada (Focal) -->
      <rect x="384" y="224" width="232" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="224" width="232" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="392" y="232" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="410" y="241" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNTH</text>
      <text x="608" y="288" fill="rgba(235,108,54,0.10)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">03</text>
      <text x="500" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Inferencia de Decisiones</text>
      <text x="500" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tendencias · Prioridad Clinica</text>

      <!-- Node 4: Pantalla 2 (Output) -->
      <rect x="744" y="220" width="216" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="220" width="216" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="752" y="228" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="770" y="237" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW 2</text>
      <text x="952" y="288" fill="rgba(45,49,66,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">04</text>
      <text x="852" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tablero de Resultados</text>
      <text x="852" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Graficas · Acciones · SOAP</text>

      <!-- Legend strip -->
      <line x1="40" y1="356" x2="960" y2="356" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="388" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="60" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Vista de captura (Input)</text>

      <rect x="220" y="388" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Motor determinista</text>

      <rect x="384" y="388" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="404" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sintesis IA (Focal)</text>

      <rect x="540" y="388" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="560" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Vista de decision (Output)</text>

      <line x1="736" y1="394" x2="764" y2="394" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="772" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ruta critica</text>
    </svg>
  </div>
</body>
</html>
