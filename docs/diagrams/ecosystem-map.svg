      <rect x="404" y="84" width="216" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="404" y="84" width="216" height="80" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="412" y="92" width="36" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
