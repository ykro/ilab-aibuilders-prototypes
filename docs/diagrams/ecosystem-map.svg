<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f5f5; stroke: #d8d8d8; stroke-width: 1px; }
      .plate-rule { stroke: rgba(45, 49, 66, 0.12); stroke-width: 1px; }
      .title { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 24px; fill: #2d3142; }
      .subtitle { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #4f5d75; }
      .mono-tag { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', monospace; font-size: 10px; fill: #8d99ae; letter-spacing: 0.08em; text-transform: uppercase; }
      .mono-accent { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', monospace; font-size: 10px; fill: #eb6c36; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
      .node { fill: #ffffff; stroke: rgba(45, 49, 66, 0.16); stroke-width: 1px; }
      .node-secondary { fill: #ececec; stroke: rgba(45, 49, 66, 0.14); stroke-width: 1px; }
      .node-focal { fill: #fdf3ef; stroke: #eb6c36; stroke-width: 1.5px; }
      .node-title { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #2d3142; }
      .node-body { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; fill: #4f5d75; }
      .node-code { font-family: 'Geist Mono', 'JetBrains Mono', monospace; font-size: 10.5px; fill: #2d3142; }
      .connector { stroke: #8d99ae; stroke-width: 1px; fill: none; }
      .connector-focal { stroke: #eb6c36; stroke-width: 1.25px; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8d99ae"/>
    </marker>
    <marker id="arrow-focal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="959" height="499" rx="8" class="bg"/>

  <!-- Editorial Header -->
  <text x="40" y="42" class="mono-tag">LAMINA 01 · ARQUITECTURA DEL ECOSISTEMA</text>
  <text x="40" y="70" class="title">Mapa de Prototipos de IA Aplicada — Salud Digital y Finanzas Bimonetarias</text>
  <text x="40" y="90" class="subtitle">Tres aplicaciones web en produccion (Vercel) y un cliente nativo Android con inferencia local y en la nube</text>
  <line x1="40" y1="106" x2="920" y2="106" class="plate-rule"/>

  <!-- Left Column: Product Domains -->
  <text x="40" y="132" class="mono-tag">01 / DOMINIOS DE PRODUCTO Y CANALES</text>

  <!-- Domain 1: Telemedicina -->
  <rect x="40" y="146" width="270" height="96" rx="6" class="node"/>
  <text x="56" y="166" class="mono-tag">SALUD DIGITAL · WEB + ANDROID</text>
  <text x="56" y="186" class="node-title">PreConsulta (Triaje Clinico)</text>
  <text x="56" y="205" class="node-body">Voz/texto + 1 a 3 preguntas dinamicas.</text>
  <text x="56" y="223" class="node-code">telemed-preconsult-ai / android</text>

  <!-- Domain 2: Estabilizador -->
  <rect x="40" y="256" width="270" height="86" rx="6" class="node"/>
  <text x="56" y="276" class="mono-tag">FINANZAS · INGRESOS VARIABLES</text>
  <text x="56" y="296" class="node-title">Estabilizador Semanal (Q + $)</text>
  <text x="56" y="315" class="node-body">Aprende meses/semanas buenas y malas.</text>
  <text x="56" y="331" class="node-code">freelance-cashflow-smoother</text>

  <!-- Domain 3: Estados de Cuenta -->
  <rect x="40" y="356" width="270" height="86" rx="6" class="node"/>
  <text x="56" y="376" class="mono-tag">FINANZAS · ESTADOS DE CUENTA PDF</text>
  <text x="56" y="396" class="node-title">Inteligencia para Decidir (Q + $)</text>
  <text x="56" y="415" class="node-body">Parser PDF bimonetario y tendencias 3M.</text>
  <text x="56" y="431" class="node-code">card-statement-insights</text>

  <!-- Center Column: Focal AI & Deterministic Core -->
  <text x="365" y="132" class="mono-accent">02 / NUCLEO DE INFERENCIA Y EXTRACCION</text>

  <!-- Focal Node 1: Gemini 3.8 Flash + Deterministic Engines -->
  <rect x="365" y="156" width="245" height="150" rx="6" class="node-focal"/>
  <text x="383" y="178" class="mono-accent">MOTOR CENTRAL · CLOUD &amp; DETERMINISTA</text>
  <text x="383" y="200" class="node-title">Gemini 3.8 Flash API</text>
  <text x="383" y="220" class="node-body">Salidas estructuradas JSON con validacion</text>
  <text x="383" y="236" class="node-body">determinista en servidor Next.js:</text>
  <text x="383" y="258" class="node-code">• Triaje clinico + Nota SOAP</text>
  <text x="383" y="274" class="node-code">• Regla de ahorro semanal Q/$</text>
  <text x="383" y="290" class="node-code">• Extractor PDF FlateDecode (&lt;50ms)</text>

  <!-- Secondary Node: Gemma 4 E2B On-Device -->
  <rect x="365" y="328" width="245" height="114" rx="6" class="node-secondary"/>
  <text x="383" y="348" class="mono-tag">INFERENCIA LOCAL · EDGE AI</text>
  <text x="383" y="368" class="node-title">Gemma 4 E2B (MediaPipe)</text>
  <text x="383" y="388" class="node-body">Ejecucion offline en cliente nativo</text>
  <text x="383" y="404" class="node-body">Android con fallback hacia la nube.</text>
  <text x="383" y="424" class="node-code">Kotlin + Jetpack Compose</text>

  <!-- Right Column: Deliverables -->
  <text x="665" y="132" class="mono-tag">03 / ENTREGABLES PARA EL USUARIO FINAL</text>

  <rect x="665" y="146" width="255" height="96" rx="6" class="node"/>
  <text x="681" y="166" class="mono-tag">DOBLE ENTREGABLE CLINICO</text>
  <text x="681" y="186" class="node-title">Alerta Prioritaria + Ficha SOAP</text>
  <text x="681" y="205" class="node-body">Banner de urgencia para el paciente</text>
  <text x="681" y="221" class="node-body">y resumen clinico para el medico.</text>

  <rect x="665" y="256" width="255" height="86" rx="6" class="node"/>
  <text x="681" y="276" class="mono-tag">PLAN DE LIQUIDEZ SEMANAL</text>
  <text x="681" y="296" class="node-title">Cuota de Reserva y Simulador</text>
  <text x="681" y="315" class="node-body">Monto exacto a apartar por semana y</text>
  <text x="681" y="331" class="node-body">simulacion de baja (-50%) o alta (+50%).</text>

  <rect x="665" y="356" width="255" height="86" rx="6" class="node"/>
  <text x="681" y="376" class="mono-tag">DASHBOARD DE DECISIONES</text>
  <text x="681" y="396" class="node-title">Tendencias 3M y Acciones Q/$</text>
  <text x="681" y="415" class="node-body">Separacion de cuotas vs consumo regular</text>
  <text x="681" y="431" class="node-body">y ahorro mensual cuantificado.</text>

  <!-- Connectors: Left to Center -->
  <path d="M 310 194 L 365 194" class="connector-focal" marker-end="url(#arrow-focal)"/>
  <path d="M 310 218 L 338 218 L 338 378 L 365 378" class="connector" marker-end="url(#arrow)"/>
  <path d="M 310 299 L 338 299 L 338 235 L 365 235" class="connector-focal" marker-end="url(#arrow-focal)"/>
  <path d="M 310 399 L 348 399 L 348 275 L 365 275" class="connector-focal" marker-end="url(#arrow-focal)"/>

  <!-- Connectors: Center to Right -->
  <path d="M 610 194 L 665 194" class="connector-focal" marker-end="url(#arrow-focal)"/>
  <path d="M 610 235 L 638 235 L 638 299 L 665 299" class="connector-focal" marker-end="url(#arrow-focal)"/>
  <path d="M 610 275 L 630 275 L 630 399 L 665 399" class="connector-focal" marker-end="url(#arrow-focal)"/>

  <!-- Editorial Footer -->
  <line x1="40" y1="458" x2="920" y2="458" class="plate-rule"/>
  <text x="40" y="478" class="mono-tag">ILAB-AIBUILDERS-PROTOTYPES · ARQUITECTURA DE REFERENCIA</text>
  <text x="920" y="478" text-anchor="end" class="mono-tag">MODO CLARO · GTQ (Q) + USD ($)</text>
</svg>
