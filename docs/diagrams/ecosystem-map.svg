<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ecosystem-map-title ecosystem-map-desc" id="ecosystem-map-root">
      <title id="ecosystem-map-title">Ecosistema de Prototipos de IA Aplicada</title>
      <desc id="ecosystem-map-desc">Arquitectura del ecosistema mostrando tres dominios de aplicacion conectandose al nucleo Gemini 3.8 Flash y Gemma 4 E2B para producir entregables clinicos y financieros bimonetarios.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ecosystem-map-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ecosystem-map-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <pattern id="ecosystem-map-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="ecosystem-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="ecosystem-map-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="ecosystem-map-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#ecosystem-map-dots)" opacity="0.55"/>

      <!-- Zone 1: Canales de Captura -->
      <rect x="40" y="48" width="248" height="360" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="108" y="52" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="164" y="61" fill="#2d3142" fill-opacity="0.45" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CANALES CAPTURA</text>

      <!-- Zone 2: Nucleo de Inferencia -->
      <rect x="380" y="48" width="264" height="360" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="452" y="52" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="61" fill="#2d3142" fill-opacity="0.45" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NUCLEO INFERENCIA</text>

      <!-- Zone 3: Entregables de Producto -->
      <rect x="736" y="48" width="264" height="360" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="808" y="52" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="868" y="61" fill="#2d3142" fill-opacity="0.45" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SALIDAS PRODUCTO</text>

      <!-- Arrows first (behind boxes) -->
      <!-- PreConsulta -> Gemini 3.8 Flash -->
      <line x1="264" y1="116" x2="404" y2="116" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ecosystem-map-arrow-link)"/>
      <!-- PreConsulta -> Gemma 4 E2B (orthogonal elbow from bottom-right port y=140) -->
      <path d="M 264,140 H 324 Q 332,140 332,148 V 324 Q 332,332 340,332 H 404" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ecosystem-map-arrow)"/>

      <!-- Estabilizador -> Gemini 3.8 Flash -->
      <path d="M 264,228 H 348 Q 356,228 356,220 V 140 Q 356,132 364,132 H 404" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ecosystem-map-arrow-accent)"/>

      <!-- Estados de Cuenta -> Extractor PDF -->
      <line x1="264" y1="340" x2="304" y2="340" stroke="#eb6c36" stroke-width="1.4"/>
      <path d="M 304,340 Q 312,340 312,332 V 236 Q 312,228 320,228 H 404" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ecosystem-map-arrow-accent)"/>

      <!-- Extractor PDF -> Gemini 3.8 Flash (vertical upward on center x=512) -->
      <line x1="512" y1="196" x2="512" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ecosystem-map-arrow)"/>

      <!-- Gemini 3.8 Flash -> Ficha Clinica SOAP -->
      <line x1="620" y1="116" x2="760" y2="116" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ecosystem-map-arrow-accent)"/>

      <!-- Gemini 3.8 Flash -> Plan Semanal Q/$ -->
      <path d="M 620,132 H 684 Q 692,132 692,140 V 220 Q 692,228 700,228 H 760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ecosystem-map-arrow)"/>

      <!-- Extractor + Gemini -> Dashboard Decisiones -->
      <path d="M 620,228 H 668 Q 676,228 676,236 V 332 Q 676,340 684,340 H 760" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ecosystem-map-arrow-accent)"/>

      <!-- Gemma 4 E2B -> Ficha Clinica SOAP (offline sync) -->
      <path d="M 620,332 H 712 Q 720,332 720,324 V 148 Q 720,140 728,140 H 760" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ecosystem-map-arrow)"/>

      <!-- Arrow Labels (opaque #f5f5f5 masks, 6-10px off line) -->
      <rect x="296" y="96" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="105" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOZ / TEXTO</text>

      <rect x="656" y="96" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="690" y="105" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JSON / SOAP</text>

