      <line x1="804" y1="474" x2="832" y2="474" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ecosystem-map-arrow)"/>
      <text x="840" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ruta local / offline</text>
