      <rect x="760" y="196" width="216" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="196" width="216" height="68" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="768" y="204" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="786" y="213" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>
      <text x="868" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reserva Semanal Q/$</text>
      <text x="868" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Simulador -50% a +50%</text>

      <!-- Node 9: Dashboard de Decisiones (Right Bottom) -->
      <rect x="760" y="304" width="216" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="304" width="216" height="68" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="768" y="312" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
