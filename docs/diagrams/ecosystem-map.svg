      <text x="554" y="183" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEXTO 4KB</text>

      <rect x="338" y="340" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="366" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OFFLINE</text>

