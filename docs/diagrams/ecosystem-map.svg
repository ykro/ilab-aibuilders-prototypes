      <text x="60" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Nucleo IA / Motor</text>

      <rect x="188" y="468" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Aplicacion / Captura</text>

      <rect x="348" y="468" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="368" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entregable / Salida</text>

      <rect x="496" y="468" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <text x="516" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inferencia Local Edge</text>

