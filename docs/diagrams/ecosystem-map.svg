      <text x="868" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tablero de Decisiones</text>
      <text x="868" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tendencias 3M · Cuotas</text>

      <!-- Legend strip -->
      <line x1="40" y1="436" x2="1000" y2="436" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
